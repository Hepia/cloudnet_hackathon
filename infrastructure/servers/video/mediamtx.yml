# MediaMTX: RTSP on 8554, RTP/RTCP over UDP on 8000/8001 (or interleaved in TCP if the client asks).
logLevel: info
logDestinations: [stdout]
api: no
metrics: no

rtsp: yes
rtspAddress: :8554
rtspTransports: [udp, multicast, tcp]
rtpAddress: :8000
rtcpAddress: :8001
rtmp: no
hls: no
webrtc: no
srt: no

paths:
  low:
    runOnDemand: ffmpeg -hide_banner -loglevel warning -re -stream_loop -1 -i /videos/low.mp4 -c copy -rtsp_transport tcp -f rtsp rtsp://localhost:$RTSP_PORT/$MTX_PATH
    runOnDemandRestart: yes
    runOnDemandCloseAfter: 10s
  medium:
    runOnDemand: ffmpeg -hide_banner -loglevel warning -re -stream_loop -1 -i /videos/medium.mp4 -c copy -rtsp_transport tcp -f rtsp rtsp://localhost:$RTSP_PORT/$MTX_PATH
    runOnDemandRestart: yes
    runOnDemandCloseAfter: 10s
  high:
    runOnDemand: ffmpeg -hide_banner -loglevel warning -re -stream_loop -1 -i /videos/high.mp4 -c copy -rtsp_transport tcp -f rtsp rtsp://localhost:$RTSP_PORT/$MTX_PATH
    runOnDemandRestart: yes
    runOnDemandCloseAfter: 10s
